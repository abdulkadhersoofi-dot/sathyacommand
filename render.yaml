# Render Blueprint: the live Sathya HMS (app and API at one address) and its PostgreSQL database, in Singapore.
# Render dashboard → New → Blueprint → choose this repository → enter MD_MOBILE → Apply.
# The existing static demo site is separate and keeps running on sample data.

databases:
  - name: sathya-hms-db
    databaseName: sathya_hms
    user: sathya
    region: singapore
    plan: basic-256mb            # a paid database: free ones are deleted after a trial period
    postgresMajorVersion: "16"

services:
  - type: web
    name: sathya-hms
    runtime: node
    region: singapore
    plan: starter                # always on: free services sleep, and sign-in codes and alerts need it awake
    branch: main
    autoDeploy: true             # each merge into main goes live
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -w server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sathya-hms-db
          property: connectionString
      - key: MD_MOBILE           # the MD's 10-digit mobile number: the first login
        sync: false
      - key: OTP_DELIVERY        # sign-in codes go to the Logs tab until an SMS provider is connected
        value: log
