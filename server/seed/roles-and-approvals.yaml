# Sathya HMS · roles, approval limits and God Mode alerts (DRAFT for MD review)
# Amounts in ₹. Change any number; the software reads this file as configuration.

sign_in:
  personal: mobile_otp
  second_factor_required: [managing_director, general_manager, accounts, hr_payroll]
  shared_tablets: quick_switch_pin_4_digits
  device_registration_required: [accounts, hr_payroll, stores, front_office_manager]
  shift_bound: [reception, captain, chef, bartender, room_attendant, security, engineering]
  session_timeout_minutes: { god_mode: 15, back_office: 30, operations: 240 }

# permissions: what a role may change besides its day-to-day work.
#   inventory.edit   add, edit, renumber or archive rooms and room types
#   devices.approve  approve a new device for a back-office login
#   users.manage     create staff logins and assign roles (not God Mode roles)
#   front_desk       reservations, room assignment, check-in / check-out, payments, cashier shift
#   folio.reverse    reverse a charge on a guest bill
#   discount.approve approve a discount above the requester's limit
#   night_audit      run the night audit (closes the business day)
#   invoice.view     see tax invoices, credit notes and vouchers
#   invoice.credit_note  issue a credit note against an invoice
#   einvoice.generate    register invoices with the GST portal (IRN)
#   site.edit        draft changes to the 3D resort layout (Twin Studio)
#   site.publish     publish a new version of the 3D resort layout
#   fnb.order        open restaurant / bar / room-service orders, add items, send KOTs, mark served
#   kitchen          kitchen and bar screens: cooking, ready, recall; mark items sold out
#   fnb.void         cancel an item after its KOT went to the kitchen (others need this role's approval)
#   fnb.bill         print and settle restaurant / bar bills, split and charge to room, restaurant cashier shift
#   fnb.discount     approve a restaurant discount above the requester's limit (within the approver's own limit)
#   bar.stock        bar brands, TASMAC purchases, breakage, physical counts, stock register
#   bar.approve      approve bar counts (correcting the book stock) and breakage above a role's limit
#   kitchen.stock    kitchen ingredients, recipes, receipts into the kitchen, counts
#   kitchen.approve  approve kitchen wastage above a role's limit
#   food_cost.view   food cost and menu engineering report
#   printers.manage  network printers, which station / outlet prints where, test pages
#   hk.view          the housekeeping room board and lost & found
#   hk.attend        clean assigned rooms (start, checklist, photos, finish), do-not-disturb, minibar, report what is in the room
#   hk.inspect       inspect cleaned rooms and score them
#   hk.manage        assign rooms, out of order, room status, minibar list, lost & found disposal
#   staff.track      see who is on duty and where (live staff layer), SOS alerts
#   attendance.view  everyone's attendance, late arrivals and no-shows
#   roster.manage    shifts and rosters
#   broadcast.send   send messages to all staff or to roles
#   staff.settings   resort boundary for attendance, map position, selfie rule, beacons
#   eng.work         engineering tickets (take, start, hold, finish), meter readings, pool / STP / fire checks, draw spares
#   eng.manage       assets, planned maintenance, meters, assign / close / cancel tickets, spares list
#   eng.approve      approve spares issued above a role's limit
#   security.gate    gate register, patrol scans, key issue and return (guards)
#   security.view    incidents, gate register, cameras, patrols and keys (read), the security map layer
#   security.manage  checkpoints, patrol rounds, cameras, keys, assembly points; close incidents
#   emergency.start  start and end emergency mode (roll-call of everyone on duty)
#   stores.view      stores, items, vendors and rates (read)
#   stores.manage    stores, the item master, rate contracts
#   vendors.manage   the vendor master (GSTIN, PAN, TDS category, MSME status), rate contracts
#   vendors.bank     vendor bank details (accounts only: a changed account is flagged to God Mode)
#   purchase.indent  ask the stores for goods (an indent)
#   indent.approve   approve or turn down indents
#   purchase.order   raise, send and cancel purchase orders; turn indents and the market list into POs
#   purchase.approve approve purchase orders above the raiser's purchase_order limit (up to the approver's own)
#   stores.receive   receive goods at the store (count, quality check, batch and expiry)
#   purchase.bill    enter vendor bills and pass matched ones for payment
#   purchase.pay     pay vendors (TDS worked out); above vendor_payment_needs_approval_above the GM approves
#   payables.view    bills, payments, MSME due dates and TDS (read)
#   stores.issue     issue goods to departments, transfer between stores, write off expired stock
#   stores.count     count a store; within stock_adjustment the book is corrected at once, above it the GM approves
#   stock.approve    approve count variances
#   stores.breakage  record crockery, cutlery and glassware broken (charged to the guest's bill or staff when so)
#   compliance.view  the compliance calendar (licences, contracts, statutory checks) and utility costs
#   (anyone signed in can report a fault and follow the tickets they reported)
#   menu.edit        add and edit menu items and tables (price changes go to menu.price for approval)
#   menu.price       change menu prices and import the menu
#   bar.settings     licensed bar hours and dry days
#   licences.edit    add and edit licences and permits (FSSAI, FL-3, TN VAT, fire NOC, ...) and their renewal dates
#   tax.vat          TN VAT rates and liquor classes
#   accounts.view    the books: day book, ledgers, trial balance, profit and loss, balance sheet (read)
#   accounts.post    journal entries (put right only by reversal), the chart of accounts
#   accounts.lock    lock a month's books once closed (only the MD reopens one)
#   receivables.view company and agent accounts on credit, statements and ageing (read)
#   receivables.manage  open company accounts, terms, money received from them (with their TDS)
#   credit.limit     set a company's credit limit (credit beyond it is refused at the desk and the restaurant)
#   bank.reconcile   bank accounts, statement import and matching, settlements and charges from the statement
#   cash.manage      bank the cash, petty cash float and its expenses
#   gst.view         GST return data: GSTR-1, GSTR-3B, GSTR-2B matching (read)
#   gst.file         import GSTR-2B, accept or reject invoices (IMS), record returns as filed
#   tds.manage       TDS deposits (challans), lower-deduction certificates, quarterly statements, advance tax
#   vat.file         TN VAT return data and registers, record the return as filed
#   assets.manage    fixed-asset register, monthly depreciation, disposals
#   budget.manage    department budgets
#   '*'              everything, including deciding approvals
roles:
  managing_director:
    god_mode: true
    permissions: ['*']
    limits: unlimited
  general_manager:
    permissions: [inventory.edit, devices.approve, users.manage, front_desk, folio.reverse, discount.approve, night_audit, invoice.view, invoice.credit_note, site.edit, site.publish, fnb.order, fnb.void, fnb.bill, fnb.discount, menu.edit, menu.price, bar.settings, bar.stock, bar.approve, kitchen.stock, kitchen.approve, food_cost.view, printers.manage, licences.edit, hk.view, hk.manage, hk.inspect, staff.track, attendance.view, roster.manage, broadcast.send, staff.settings, eng.manage, eng.approve, compliance.view, security.view, security.manage, emergency.start, stores.view, stores.manage, vendors.manage, vendors.bank, purchase.indent, indent.approve, purchase.order, purchase.approve, payables.view, stock.approve, stores.issue, stores.count, stores.breakage, accounts.view, accounts.lock, receivables.view, credit.limit, gst.view, budget.manage]
    limits: { discount_percent: 25, breakage_per_entry: 10000, refund: 50000, comp_room_nights: 5, purchase_order: 500000, rate_override_below_floor: true }
  operations_manager:
    permissions: [front_desk, folio.reverse, discount.approve, site.edit, fnb.order, fnb.void, fnb.bill, fnb.discount, hk.view, hk.manage, hk.inspect, staff.track, attendance.view, roster.manage, broadcast.send, eng.manage, eng.approve, compliance.view, security.view, security.manage, emergency.start, purchase.indent, indent.approve]
    limits: { discount_percent: 20, void_per_bill: 5000, room_move: true, mark_out_of_order: true, overtime_hours_per_week: 12 }
  front_office_manager:
    permissions: [front_desk, folio.reverse, night_audit, invoice.credit_note, receivables.view, hk.view, attendance.view, roster.manage, broadcast.send, security.view, emergency.start, purchase.indent]
    limits: { discount_percent: 15, refund: 10000, cashier_variance_writeoff: 500 }
  reception:
    permissions: [front_desk, fnb.order, fnb.bill, hk.view]
    limits: { discount_percent: 10, refund: 0 }
  night_auditor:
    permissions: [front_desk, night_audit]
    limits: {}
  accounts:
    permissions: [invoice.view, invoice.credit_note, einvoice.generate, licences.edit, tax.vat, compliance.view, stores.view, vendors.manage, vendors.bank, purchase.bill, purchase.pay, payables.view, accounts.view, accounts.post, receivables.view, receivables.manage, bank.reconcile, cash.manage, gst.view, gst.file, tds.manage, vat.file, assets.manage, budget.manage]
    limits: { vendor_payment_needs_approval_above: 25000, delete_vouchers: false }
  stores:
    permissions: [stores.view, stores.manage, vendors.manage, purchase.indent, purchase.order, stores.receive, stores.issue, stores.count, stores.breakage]
    limits: { purchase_order: 25000, stock_adjustment: 0 }
  executive_housekeeper:
    permissions: [hk.view, hk.attend, hk.inspect, hk.manage, attendance.view, roster.manage, broadcast.send, purchase.indent, stores.breakage]
    limits: { linen_writeoff: 2000 }
  hk_supervisor:
    permissions: [hk.view, hk.attend, hk.inspect]
    limits: {}
  room_attendant:
    permissions: [hk.attend]
    limits: {}
  fnb_manager:
    permissions: [fnb.order, fnb.void, fnb.bill, fnb.discount, kitchen, menu.edit, kitchen.stock, kitchen.approve, food_cost.view, printers.manage, attendance.view, roster.manage, broadcast.send, purchase.indent, stores.breakage]
    limits: { discount_percent: 15, void_per_bill: 3000, staff_meal: true, menu_price_change_needs: general_manager }
  captain:
    permissions: [fnb.order, fnb.bill]
    limits: { void_after_kot_print: false }
  chef:
    permissions: [kitchen, kitchen.stock, purchase.indent]
    limits: { wastage_per_entry: 1000 }
  bar_manager:
    permissions: [fnb.order, fnb.void, fnb.bill, fnb.discount, kitchen, bar.settings, bar.stock, purchase.indent, stores.breakage]
    limits: { discount_percent: 10, breakage_per_entry: 1500 }
  bartender:
    permissions: [fnb.order, fnb.bill, kitchen]
    limits: {}
  sales_banquets:
    limits: { package_discount_percent: 10, hold_dates_days: 7 }
  chief_engineer:
    permissions: [eng.work, eng.manage, compliance.view, attendance.view, roster.manage, broadcast.send, purchase.indent]
    limits: { spares_issue: 25000 }
  engineering:
    permissions: [eng.work]
    limits: { spares_issue: 5000 }
  security_head:
    permissions: [staff.track, security.gate, security.view, security.manage, emergency.start, attendance.view, roster.manage, broadcast.send]
    limits: {}
  security:
    permissions: [staff.track, security.gate, security.view, emergency.start]
    limits: {}
  hr_payroll:
    permissions: [users.manage, attendance.view, roster.manage, broadcast.send]
    limits: { salary_advance: 10000, payroll_release_needs: [general_manager, managing_director] }
  employee_self_service:
    limits: {}
  external_auditor:
    read_only: true
    permissions: [accounts.view, invoice.view, payables.view, receivables.view, gst.view]
    access_expires_days: 30

god_mode_alerts:
  - { id: void_after_kot, notify: [managing_director, fnb_manager], channel: push }
  - { id: bill_reprint_count_above, value: 1, notify: [managing_director], channel: push }
  - { id: discount_above_role_limit_attempt, notify: [managing_director], channel: push }
  - { id: cashier_variance_above, value: 500, notify: [managing_director, front_office_manager], channel: push }
  - { id: liquor_pour_variance_percent_above, value: 3, notify: [managing_director, general_manager], channel: push }
  - { id: sleeper_skipper_discrepancy, notify: [managing_director, front_office_manager], channel: push }
  - { id: rate_below_floor, notify: [managing_director], channel: push }
  - { id: sign_in_outside_shift_or_new_device, notify: [managing_director], channel: push }
  - { id: staff_outside_zone_minutes, value: 15, notify: [operations_manager], channel: push }
  - { id: stock_adjustment_above, value: 2000, notify: [managing_director, general_manager], channel: push }
  - { id: accounting_edit_after_day_close, notify: [managing_director], channel: push }
  - { id: cash_receipt_at_or_above, value: 200000, action: block, notify: [managing_director], channel: push }
  - { id: sos_pressed, notify: [managing_director, operations_manager, security], channel: [push, call] }

md_flash_report:
  time: "08:00"
  channel: whatsapp
  contents: [occupancy, revenue_by_department, cash_position, alerts_last_24h, arrivals_today, events_today]

staff_location:
  only_on_shift: true
  ping_seconds_moving: 30
  history_days: 90
  staff_can_view_own_history: true
