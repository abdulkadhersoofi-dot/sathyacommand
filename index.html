<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1a18">
<title>Sathya Command</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<!--APP-->
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <div class="brand-name">Sathya Command</div>
        <div class="brand-sub" id="source-label">Sathya Park &amp; Resorts</div>
      </div>
    </div>
    <div class="topbar-mid">
      <button class="date-chip" id="date-chip" type="button" aria-label="Viewed date"></button>
      <span class="clock" id="clock"></span>
      <span class="sample-badge" title="Phase 1 runs on generated sample bookings. Phase 2 connects the live HMS.">Sample data</span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn ap-btn" id="btn-approvals" type="button" title="Approvals" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg><b>Approvals</b><i class="ib-count"></i></button>
      <button class="god-btn" id="btn-god" type="button" aria-pressed="false"><span class="god-dot"></span><span class="god-text">God Mode</span></button>
      <div class="user">
        <button class="user-btn" id="btn-user" type="button" aria-haspopup="menu" aria-expanded="false" title="You"><span class="avatar" id="user-avatar"></span><span class="user-name" id="user-name"></span></button>
        <div class="user-menu" id="user-menu" role="menu" hidden>
          <div class="menu-who" id="menu-who"></div>
          <button class="menu-row" role="menuitemcheckbox" id="btn-night" type="button" aria-pressed="false" title="Day / night"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg><span>Night</span></button>
          <button class="menu-row" role="menuitemcheckbox" id="btn-eco" type="button" aria-pressed="false" title="Eco mode: no shadows or ambient motion, saves battery"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19c8 0 14-6 14-14-8 0-14 4-14 12v2Zm0 0 7-7"/></svg><span>Eco</span></button>
        </div>
      </div>
    </div>
  </header>
  <nav class="rail" id="rail" aria-label="Modules">
    <button class="rail-btn" id="btn-map" type="button" title="Map: the resort live, in 3D" aria-current="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg><span>Map</span></button>
    <button class="rail-btn" id="btn-frontdesk" type="button" title="Front desk: arrivals, bookings, check-in and out, payments" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M5 21V8l7-5 7 5v13"/><path d="M9 21v-6h6v6"/></svg><span>Front desk</span></button>
    <button class="rail-btn" id="btn-fnb" type="button" title="Restaurant: orders, kitchen, menu, licences &amp; tax" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 0-3 2-3 5s1 4 3 4v9"/></svg><span>Restaurant</span></button>
    <button class="rail-btn" id="btn-hk" type="button" title="Housekeeping: rooms, cleaning, laundry, linen, lost &amp; found" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3 9 13m-2 0h8l2 8H5l2-8Z"/></svg><span>Housekeeping</span></button>
    <button class="rail-btn" id="btn-bq" type="button" title="Banquets &amp; sales: venue calendar, weddings and events, quotes, advances, event orders, final bills, company accounts, room blocks" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V10l8-6 8 6v11M9 21v-6h6v6M4 10h16"/></svg><span>Banquets</span></button>
    <button class="rail-btn" id="btn-guests" type="button" title="Guests: requests from rooms, messages, feedback, activities, room QR cards" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Guests</span></button>
    <button class="rail-btn" id="btn-staff" type="button" title="Staff: clock in and out, SOS, messages, team, rosters, logins" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="3.5"/><path d="M5 21c0-4 3-7 7-7s7 3 7 7"/></svg><span>Staff</span></button>
    <button class="rail-btn" id="btn-hr" type="button" title="People: employees, pay structures, payroll, leave, holidays, training" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15 14.5c3 0 6 1.8 6 5"/></svg><span>People</span></button>
    <button class="rail-btn" id="btn-eng" type="button" title="Engineering: report a fault, tickets, maintenance, meters, compliance" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4Z"/></svg><span>Engineering</span></button>
    <button class="rail-btn" id="btn-sec" type="button" title="Security: gate, patrols, incidents, keys, cameras, emergency" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 3 8.5 7 10 4-1.5 7-5.5 7-10V6l-7-3Z"/></svg><span>Security</span></button>
    <button class="rail-btn" id="btn-inv" type="button" title="Stores &amp; purchase: items, vendors, rates, stores" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5V8Zm0 0 9 5 9-5M12 13v8"/></svg><span>Stores</span></button>
    <button class="rail-btn" id="btn-acc" type="button" title="Accounts: day book, ledgers, trial balance, profit &amp; loss, balance sheet" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM4 9h16M9 9v11"/></svg><span>Accounts</span></button>
    <button class="rail-btn" id="btn-settings" type="button" title="Settings: resort profile (legal name, GSTIN, PAN, TAN, address), closing the day, getting started" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg><span>Settings</span></button>
  </nav>

  <main class="stage" id="stage">
    <div class="labels" id="labels"></div>

    <nav class="layers" id="layers" aria-label="Map layers"></nav>

    <div class="map-tools">
      <button class="tool" id="btn-zoom-in" type="button" aria-label="Zoom in">+</button>
      <button class="tool" id="btn-zoom-out" type="button" aria-label="Zoom out">−</button>
      <button class="tool" id="btn-home" type="button" aria-label="Reset view" title="Reset view"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg></button>
      <button class="tool" id="btn-explode" type="button" aria-pressed="false" title="Separate Park Wing floors"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <button class="tool" id="btn-studio" type="button" aria-pressed="false" title="Edit resort layout" aria-label="Edit resort layout" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4Zm9-13 4 4"/></svg></button>
    </div>

    <div class="legend" id="legend"></div>
    <div class="hint" id="hint">Hover or tap a building · double-tap to fly in · drag to orbit</div>

    <div class="tip" id="tip" hidden></div>
  </main>

  <aside class="side" id="side">
    <button class="side-grip" id="side-grip" type="button" aria-label="Expand panel"></button>
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="live" aria-selected="true">Live</button>
      <button role="tab" data-tab="arrivals">Front desk</button>
      <button role="tab" data-tab="kitchen">Kitchen <span class="tab-count" id="kot-count"></span></button>
      <button role="tab" data-tab="events">Events</button>
    </div>
    <div class="side-body" id="side-body"></div>
  </aside>

  <section class="dock">
    <div class="kpis" id="kpis"></div>
    <div class="timeline">
      <button class="tl-step" id="tl-prev" type="button" aria-label="Previous day">‹</button>
      <div class="tl-track" id="tl-track" role="slider" tabindex="0" aria-label="Date"></div>
      <button class="tl-step" id="tl-next" type="button" aria-label="Next day">›</button>
      <button class="tl-today" id="tl-today" type="button">Today</button>
    </div>
  </section>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-inner" id="drawer-inner"></div>
  </aside>

  <div class="modal" id="pin-modal" hidden>
    <form class="pin-card" id="pin-form">
      <div class="pin-title">Owner access</div>
      <p class="pin-copy">God Mode shows revenue, rates and full guest contacts, and unlocks owner actions. In production this is a biometric or two-factor sign-in.</p>
      <label for="pin-input">Owner PIN <span class="muted">(demo: 1234)</span></label>
      <input id="pin-input" inputmode="numeric" maxlength="4" autocomplete="off">
      <div class="pin-error" id="pin-error" hidden>That PIN didn't match. Try 1234.</div>
      <div class="pin-actions">
        <button type="button" class="btn ghost" id="pin-cancel">Cancel</button>
        <button type="submit" class="btn primary">Unlock</button>
      </div>
    </form>
  </div>
  <div class="toast" id="toast" hidden></div>
</div>
<!--/APP-->
<script type="module" src="/src/main.ts"></script>
</body>
</html>
